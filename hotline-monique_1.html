/* ---------- geração de fase ---------- */
function idx(x,y){ return y*MW+x; }
function solidTile(px,py){
  const x=Math.floor(px/TILE), y=Math.floor(py/TILE);
  if(x<0||y<0||x>=MW||y>=MH) return true;
  return G.lv.grid[idx(x,y)]===1;
}
function blocked(px,py,r){
  return solidTile(px-r,py-r)||solidTile(px+r,py-r)||solidTile(px-r,py+r)||solidTile(px+r,py+r);
}
function moveEnt(e,dx,dy){
  if(!blocked(e.x+dx,e.y,e.r)) e.x+=dx; else if(!blocked(e.x+dx*0.35,e.y,e.r)) e.x+=dx*0.35;
  if(!blocked(e.x,e.y+dy,e.r)) e.y+=dy; else if(!blocked(e.x,e.y+dy*0.35,e.r)) e.y+=dy*0.35;
}
function los(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1), st=Math.max(2,Math.floor(d/6));
  for(let i=1;i<st;i++){ const t=i/st; if(solidTile(x1+(x2-x1)*t,y1+(y2-y1)*t)) return false; }
  return true;
}
function ctr(x,y){ return {x:x*TILE+TILE/2, y:y*TILE+TILE/2}; }

    for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
      grid[idx(x,y)]=0;
      col[idx(x,y)]=(Math.floor(x/7)+Math.floor(y/5))%PAL.length;
    }
    for(let i=0;i<9;i++){
      const px=3+Math.floor(rnd()*(MW-8)), py=3+Math.floor(rnd()*(MH-7));
      for(let y=py;y<py+2;y++) for(let x=px;x<px+2;x++) grid[idx(x,y)]=1;
    }
    rooms.push({x0:1,y0:1,x1:MW-2,y1:MH-2});
  } else {
    for(let cy=0;cy<ROWS;cy++) for(let cx=0;cx<COLS;cx++){
      const x0=cx*CW+1, y0=cy*CH+1, x1=cx*CW+CW-2, y1=cy*CH+CH-2;
      const c=Math.floor(rnd()*PAL.length);
      for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ grid[idx(x,y)]=0; col[idx(x,y)]=c; }
      // faixa psicodélica no chão
      if(rnd()<0.6){ const by=y0+1+Math.floor(rnd()*(y1-y0-1)), c2=Math.floor(rnd()*PAL.length);
        for(let x=x0;x<=x1;x++){ col[idx(x,by)]=c2; if(by+1<=y1) col[idx(x,by+1)]=c2; } }
      rooms.push({cx:cx,cy:cy,x0:x0,y0:y0,x1:x1,y1:y1,i:rooms.length});
    }
    // árvore geradora entre células
    const seen=new Array(COLS*ROWS).fill(false), st=[0]; seen[0]=true;
    const carve=(a,b)=>{
      const A=rooms[a], B=rooms[b];
      if(A.cy===B.cy){
        const l=A.cx<B.cx?A:B, wx=l.cx*CW+CW-1;
        const dy=Math.max(A.y0,B.y0)+Math.floor(rnd()*3);
        for(let y=dy;y<dy+2;y++){ grid[idx(wx,y)]=0; grid[idx(wx+1,y)]=0; col[idx(wx,y)]=col[idx(l.x1,y)]; col[idx(wx+1,y)]=col[idx(wx,y)]; }
      } else {
        const u=A.cy<B.cy?A:B, wy=u.cy*CH+CH-1;
        const dx=Math.max(A.x0,B.x0)+Math.floor(rnd()*4);
        for(let x=dx;x<dx+2;x++){ grid[idx(x,wy)]=0; grid[idx(x,wy+1)]=0; col[idx(x,wy)]=col[idx(x,u.y1)]; col[idx(x,wy+1)]=col[idx(x,wy)]; }
      }
    };
    while(st.length){
      const cur=st[st.length-1], cx=cur%COLS, cy=Math.floor(cur/COLS), nb=[];
      if(cx>0&&!seen[cur-1])nb.push(cur-1); if(cx<COLS-1&&!seen[cur+1])nb.push(cur+1);
      if(cy>0&&!seen[cur-COLS])nb.push(cur-COLS); if(cy<ROWS-1&&!seen[cur+COLS])nb.push(cur+COLS);
      if(!nb.length){ st.pop(); continue; }
      const n=nb[Math.floor(rnd()*nb.length)]; seen[n]=true; carve(cur,n); st.push(n);
    }
    for(let i=0;i<COLS*ROWS;i++){
      if(i%COLS<COLS-1 && rnd()<0.35) carve(i,i+1);
      if(i+COLS<COLS*ROWS && rnd()<0.3) carve(i,i+COLS);
    }
  }

  const lv={grid:grid,col:col,rooms:rooms,arena:arena,name:def.name,sub:def.sub,boss:def.boss};
  G.lv=lv;

  const freeIn=(r)=>{ for(let k=0;k<60;k++){ const x=r.x0+Math.floor(rnd()*(r.x1-r.x0+1)), y=r.y0+Math.floor(rnd()*(r.y1-r.y0+1)); if(grid[idx(x,y)]===0) return ctr(x,y); } return ctr(r.x0,r.y0); };

  let spawn, exitP;
  if(arena){ spawn=ctr(3,Math.floor(MH/2)); exitP=ctr(MW-4,Math.floor(MH/2)); }
  else { spawn=freeIn(rooms[0]); exitP=freeIn(rooms[rooms.length-1]); }

  // inimigos
  const en=[];
  const kind = camp==="podador" ? "vardo" : "cult";
  const total = def.boss ? 8+G.ch : 7+G.ch*2;
  for(let i=0;i<total;i++){
    const r = arena ? rooms[0] : rooms[1+Math.floor(rnd()*(rooms.length-1))];
    const p=freeIn(r);
    if(Math.hypot(p.x-spawn.x,p.y-spawn.y)<90) continue;
    const roll=rnd();
    const type = roll<0.34?"melee" : roll<0.72?"gun" : "shot";
    en.push(mkEnemy(p.x,p.y,type,kind,rnd));
  }
  if(def.boss){
    const b=BOSSES[def.boss];
    const e=mkEnemy(exitP.x-30,exitP.y,"boss",kind,rnd);
    e.hp=b.hp; e.max=b.hp; e.mode=b.mode; e.spd=b.spd; e.name=def.boss; e.taunts=b.taunts; e.r=9; e.boss=true; e.state="alert";
    en.push(e);
  }
  // armas espalhadas
  const pk=[];
  const nW = 4+Math.floor(rnd()*3)+(def.boss?2:0);
  for(let i=0;i<nW;i++){
    const r = arena ? rooms[0] : rooms[Math.floor(rnd()*rooms.length)];
    const p=freeIn(r), id=GUN_POOL[Math.floor(rnd()*GUN_POOL.length)], d=WEP[id];
    pk.push({x:p.x,y:p.y,id:id,ammo:d.inf?-1:Math.max(2,Math.floor(d.mag*(0.4+rnd()*0.6)))});
  }

  lv.spawn=spawn; lv.exit=exitP;
  G.en=en; G.pk=pk; G.bul=[]; G.dec=[]; G.fx=[]; G.txt=[];
  G.p={x:spawn.x,y:spawn.y,ang:0,r:6,cd:0,inv:[{id:"faca",ammo:-1},{id:"pistola",ammo:9}],cur:1,step:0};
  G.cleared=false; G.dead=0; G.combo=0; G.comboT=0;
  G.trip = def.boss?0.85:0.45;
  return lv;
}

function mkEnemy(x,y,type,kind,rnd){
  const wep = type==="gun" ? "pistola" : type==="shot" ? "escopeta" : null;
  return {x:x,y:y,ang:rnd()*6.28,r:6,type:type,kind:kind,state:"idle",hp:1,max:1,
          cool:20+Math.floor(rnd()*60),tx:x,ty:y,wep:wep,dead:false,mode:null,spd:1.5,
          wait:0,step:0,tt:0,name:null,taunts:null,boss:false,ammo:wep?4+Math.floor(rnd()*4):0};
}

/* ---------- efeitos ---------- */
function shake(v){ G.shake=Math.min(14,G.shake+v); }
function flash(v){ G.flash=Math.min(1,G.flash+v); }
function toast(s){ G.msg=s; G.msgT=110; }
function blood(x,y,n,col){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, d=Math.random()*13;
  G.dec.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,r:1.5+Math.random()*3.5,c:col||"#c9053a"}); } }
function spark(x,y,c){ for(let i=0;i<5;i++){ const a=Math.random()*6.28;
  G.fx.push({x:x,y:y,vx:Math.cos(a)*(0.6+Math.random()*2),vy:Math.sin(a)*(0.6+Math.random()*2),life:14,c:c||"#ffe36b"}); } }
function float(x,y,s,c){ G.txt.push({x:x,y:y,s:s,c:c||"#ff2e88",life:70}); }

function noise(r){
  for(const e of G.en){ if(e.dead) continue;
    if(Math.hypot(e.x-G.p.x,e.y-G.p.y)<r) e.state="alert"; }
}
function alertNear(x,y,r){
  for(const e of G.en){ if(e.dead||e.state==="alert") continue;
    if(Math.hypot(e.x-x,e.y-y)<r) e.state="alert"; }
}

function killEnemy(e){
  e.dead=true; e.state="dead";
  blood(e.x,e.y,12+Math.floor(Math.random()*10));
  shake(4); flash(0.18);
  G.combo=Math.min(9,G.combo+1); G.comboT=170;
  const pts=100*G.combo;
  G.score+=pts; float(e.x,e.y-10,"+"+pts+"PTS");
  if(e.wep && Math.random()<0.85) G.pk.push({x:e.x+(Math.random()*8-4),y:e.y+(Math.random()*8-4),id:e.wep,ammo:Math.max(1,e.ammo)});
  else if(Math.random()<0.35) G.pk.push({x:e.x,y:e.y,id:Math.random()<0.5?"taco":"serra",ammo:-1});
  sfx("kill");
}
function hurtBoss(e,d){
  e.hp-=d; spark(e.x,e.y,"#ff2e88"); blood(e.x,e.y,4); shake(3);
  if(e.taunts && Math.random()<0.5) float(e.x,e.y-18,e.taunts[Math.floor(Math.random()*e.taunts.length)],"#ffe36b");
  if(e.hp<=0){ e.dead=true; e.state="dead"; blood(e.x,e.y,40); shake(12); flash(0.5); G.score+=2500; float(e.x,e.y-14,"+2500PTS"); sfx("kill"); }
}
function playerDie(){
  if(G.dead) return;
  G.dead=1; G.state="dead"; blood(G.p.x,G.p.y,26); shake(12); flash(0.6); sfx("die");
}

/* ---------- ações do jogador ---------- */
function curWep(){ return WEP[G.p.inv[G.p.cur].id]; }
function fire(){
  const p=G.p, slot=p.inv[p.cur], def=WEP[slot.id];
  if(p.cd>0||G.dead||G.state!=="play") return;
  if(def.melee){ melee(def); p.cd=def.cd; return; }
  if(slot.ammo<=0){ p.cd=18; toast("SEM MUNIÇÃO — PEGUE UMA ARMA (E)"); sfx("dry"); return; }
  slot.ammo--; p.cd=def.cd;
  let la=p.ang;
  for(let i=0;i<def.pel;i++){
    const a=p.ang+(Math.random()-0.5)*def.spread*2; la=a;
    G.bul.push({x:p.x+Math.cos(a)*11,y:p.y+Math.sin(a)*11,vx:Math.cos(a)*def.spd,vy:Math.sin(a)*def.spd,own:"p",life:80});
  }
  spark(p.x+Math.cos(la)*13,p.y+Math.sin(la)*13);
  shake(def.pel>1?5:2); flash(0.12); noise(def.noise); sfx("shot");
}
function melee(def){
  const p=G.p; let best=null,bd=26;
  for(const e of G.en){ if(e.dead) continue;
    const d=Math.hypot(e.x-p.x,e.y-p.y); if(d>bd) continue;
    const dot=Math.cos(p.ang)*(e.x-p.x)/d+Math.sin(p.ang)*(e.y-p.y)/d;
    if(dot<0.15) continue;
    if(d<bd){ bd=d; best=e; }
  }
  spark(p.x+Math.cos(p.ang)*14,p.y+Math.sin(p.ang)*14,"#e9e9ff");
  sfx("swing");
  if(!best) return;
  if(best.boss){
    if(def.stealth && best.state==="alert"){ toast("A FACA NÃO ENCOSTA NO CHEFE ACORDADO"); return; }
    hurtBoss(best,def.stealth?1:2); return;
  }
  if(def.stealth){
    const dd=Math.hypot(best.x-p.x,best.y-p.y)||1;
    const facing=Math.cos(best.ang)*(p.x-best.x)/dd+Math.sin(best.ang)*(p.y-best.y)/dd;
    if(best.state!=="alert" || facing<0.1){ killEnemy(best); G.score+=150; }
    else { best.state="alert"; alertNear(best.x,best.y,120); toast("A FACA SÓ PEGA DESPREVENIDO"); }
  } else { killEnemy(best); }
}
function swap(){
  if(G.p.inv.length<2) { toast("SÓ A FACA — PROCURE ARMA NO CENÁRIO"); return; }
  G.p.cur=(G.p.cur+1)%G.p.inv.length; sfx("click");
  const s=G.p.inv[G.p.cur]; toast(WEP[s.id].name+(s.ammo<0?"":" · "+s.ammo));
}
function grab(){
  const p=G.p; let best=null,bd=26,bi=-1;
  G.pk.forEach((k,i)=>{ const d=Math.hypot(k.x-p.x,k.y-p.y); if(d<bd){bd=d;best=k;bi=i;} });
  if(!best){ toast("NADA POR AQUI"); return; }
  const same=p.inv.find(s=>s.id===best.id);
  if(same && best.ammo>0){ same.ammo+=best.ammo; }
  else if(p.inv.length<3) p.inv.push({id:best.id,ammo:best.ammo});
  else { p.inv[p.cur]={id:best.id,ammo:best.ammo}; }
  if(!same) p.cur=Math.min(p.inv.length-1,p.inv.findIndex(s=>s.id===best.id));
  G.pk.splice(bi,1); sfx("click");
  toast("PEGOU "+WEP[best.id].name+(best.ammo<0?"":" · "+best.ammo+" BALAS"));
}

/* ---------- update ---------- */
function updatePlay(){
  const p=G.p;
  if(p.cd>0) p.cd--;
  const wx=G.cam.x+mouse.x, wy=G.cam.y+mouse.y;
  p.ang=Math.atan2(wy-p.y,wx-p.x);
  let dx=0,dy=0;
  if(keys.KeyA||keys.ArrowLeft) dx--; if(keys.KeyD||keys.ArrowRight) dx++;
  if(keys.KeyW||keys.ArrowUp) dy--; if(keys.KeyS||keys.ArrowDown) dy++;
  if(dx||dy){ const l=Math.hypot(dx,dy); const sp=2.15; moveEnt(p,dx/l*sp,dy/l*sp); p.step+=0.28; }
  if(mouse.down && curWep().auto) fire();

  // inimigos
  for(const e of G.en){
    if(e.dead) continue;
    e.tt++;
    const d=Math.hypot(p.x-e.x,p.y-e.y);
    const ea=Math.atan2(p.y-e.y,p.x-e.x);
    let diff=Math.abs(((ea-e.ang+Math.PI*3)%(Math.PI*2))-Math.PI);
    if(e.state!=="alert" && !e.boss){
      if(d<180 && diff<0.95 && los(e.x,e.y,p.x,p.y)){ e.state="alert"; alertNear(e.x,e.y,110); }
      else if(d<34 && los(e.x,e.y,p.x,p.y)) e.state="alert";
    }
    if(e.state==="alert"){
      if(e.boss){ bossAI(e,d,ea); continue; }
      if(e.type==="melee"){
        if(d>10){ moveEnt(e,Math.cos(ea)*1.55,Math.sin(ea)*1.55); e.step+=0.3; }
        else playerDie();
        e.ang=ea;
      } else {
        const want = e.type==="shot"?95:135;
        if(d>want){ moveEnt(e,Math.cos(ea)*1.25,Math.sin(ea)*1.25); e.step+=0.25; }
        else if(d<want*0.6){ moveEnt(e,-Math.cos(ea)*0.9,-Math.sin(ea)*0.9); e.step+=0.2; }
        e.ang=ea;
        e.cool--;
        if(e.cool<=0 && los(e.x,e.y,p.x,p.y) && e.ammo>0){
          e.ammo--;
          const pel=e.type==="shot"?4:1, sp=e.type==="shot"?0.2:0.05;
          for(let i=0;i<pel;i++){ const a=ea+(Math.random()-0.5)*sp*2;
            G.bul.push({x:e.x+Math.cos(a)*10,y:e.y+Math.sin(a)*10,vx:Math.cos(a)*4.4,vy:Math.sin(a)*4.4,own:"e",life:80}); }
          spark(e.x+Math.cos(ea)*12,e.y+Math.sin(ea)*12);
          e.cool=e.type==="shot"?95:62; sfx("shot");
        }
        if(e.ammo<=0 && d<40) playerDie();
      }
    } else {
      // patrulha
      if(e.wait>0){ e.wait--; }
      else {
        const dd=Math.hypot(e.tx-e.x,e.ty-e.y);
        if(dd<8){ e.wait=40+Math.floor(Math.random()*90);
          e.tx=e.x+(Math.random()*160-80); e.ty=e.y+(Math.random()*140-70);
          if(solidTile(e.tx,e.ty)){ e.tx=e.x; e.ty=e.y; }
        } else { const a=Math.atan2(e.ty-e.y,e.tx-e.x); moveEnt(e,Math.cos(a)*0.62,Math.sin(a)*0.62); e.ang=a; e.step+=0.15; }
      }
    }
  }

  // balas
  for(let i=G.bul.length-1;i>=0;i--){
    const b=G.bul[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.life<=0){ G.bul.splice(i,1); continue; }
    if(solidTile(b.x,b.y)){ spark(b.x,b.y,"#ffffff"); G.bul.splice(i,1); continue; }
    if(b.own==="p"){
      let hit=false;
      for(const e of G.en){ if(e.dead) continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+2){ if(e.boss) hurtBoss(e,1); else { killEnemy(e); alertNear(e.x,e.y,150); } hit=true; break; } }
      if(hit){ G.bul.splice(i,1); continue; }
    } else if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+2){ G.bul.splice(i,1); playerDie(); continue; }
  }

  for(let i=G.fx.length-1;i>=0;i--){ const f=G.fx[i]; f.x+=f.vx; f.y+=f.vy; f.vx*=0.9; f.vy*=0.9; if(--f.life<=0) G.fx.splice(i,1); }
  for(let i=G.txt.length-1;i>=0;i--){ const t=G.txt[i]; t.y-=0.28; if(--t.life<=0) G.txt.splice(i,1); }
  if(G.comboT>0){ if(--G.comboT<=0) G.combo=0; }
  if(G.msgT>0) G.msgT--;
  if(G.shake>0) G.shake*=0.86;
  if(G.flash>0) G.flash*=0.9;

  if(!G.cleared && G.en.every(e=>e.dead)){ G.cleared=true; toast("LIMPO. VÁ ATÉ A SAÍDA (BRILHO ROSA)"); }
  if(G.cleared && Math.hypot(p.x-G.lv.exit.x,p.y-G.lv.exit.y)<18) finishChapter();

  const camx=Math.max(0,Math.min(MW*TILE-W,p.x-W/2)), camy=Math.max(0,Math.min(MH*TILE-H,p.y-H/2));
  G.cam.x+=(camx-G.cam.x)*0.16; G.cam.y+=(camy-G.cam.y)*0.16;
}

function bossAI(e,d,ea){
  const p=G.p;
  e.ang=ea; e.cool--;
  if(e.mode==="charge"){
    if(d>14) moveEnt(e,Math.cos(ea)*e.spd,Math.sin(ea)*e.spd); else playerDie();
    e.step+=0.3;
    if(e.cool<=0 && d<220 && los(e.x,e.y,p.x,p.y)){
      const a=ea+(Math.random()-0.5)*0.1;
      G.bul.push({x:e.x+Math.cos(a)*11,y:e.y+Math.sin(a)*11,vx:Math.cos(a)*5.2,vy:Math.sin(a)*5.2,own:"e",life:80});
      e.cool=70; sfx("shot");
    }
  } else if(e.mode==="spread"){
    if(d>150) moveEnt(e,Math.cos(ea)*e.spd,Math.sin(ea)*e.spd);
    else if(d<90) moveEnt(e,-Math.cos(ea)*e.spd*0.7,-Math.sin(ea)*e.spd*0.7);
    e.step+=0.2;
    if(e.cool<=0 && los(e.x,e.y,p.x,p.y)){
      for(let i=-2;i<=2;i++){ const a=ea+i*0.16;
        G.bul.push({x:e.x+Math.cos(a)*11,y:e.y+Math.sin(a)*11,vx:Math.cos(a)*4.2,vy:Math.sin(a)*4.2,own:"e",life:80}); }
      e.cool=88; shake(3); sfx("shot");
    }
  } else if(e.mode==="auto"){
    if(d>120) moveEnt(e,Math.cos(ea)*e.spd,Math.sin(ea)*e.spd); else if(d<70) moveEnt(e,-Math.cos(ea)*e.spd,-Math.sin(ea)*e.spd);
    e.step+=0.22;
    if(e.cool<=0 && los(e.x,e.y,p.x,p.y)){
      const a=ea+(Math.random()-0.5)*0.28;
      G.bul.push({x:e.x+Math.cos(a)*11,y:e.y+Math.sin(a)*11,vx:Math.cos(a)*4.8,vy:Math.sin(a)*4.8,own:"e",life:80});
      e.cool=9; sfx("shot");
    }
  } else if(e.mode==="boss_monique"){
    const orb=ea+Math.sin(e.tt/45)*1.1;
    if(d>110) moveEnt(e,Math.cos(orb)*e.spd,Math.sin(orb)*e.spd);
    else moveEnt(e,Math.cos(orb+1.4)*e.spd,Math.sin(orb+1.4)*e.spd);
    e.step+=0.3;
    if(e.cool<=0 && los(e.x,e.y,p.x,p.y)){
      const n=e.hp<9?5:3;
      for(let i=0;i<n;i++){ const a=ea+(i-(n-1)/2)*0.22;
        G.bul.push({x:e.x+Math.cos(a)*11,y:e.y+Math.sin(a)*11,vx:Math.cos(a)*4.6,vy:Math.sin(a)*4.6,own:"e",life:80}); }
      e.cool=e.hp<9?54:76; shake(3); flash(0.1); sfx("shot");
      if(Math.random()<0.55) float(e.x,e.y-20,e.taunts[Math.floor(Math.random()*e.taunts.length)],"#ff8ad0");
    }
    if(e.tt%420===0 && e.hp<13){
      for(let i=0;i<2;i++){
        const a=Math.random()*6.28, x=e.x+Math.cos(a)*60, y=e.y+Math.sin(a)*60;
        if(!solidTile(x,y)){ const m=mkEnemy(x,y,Math.random()<0.5?"melee":"gun",e.kind,Math.random); m.state="alert"; G.en.push(m); }
      }
      float(e.x,e.y-26,"EU TENHO GENTE NA ESCADA!","#ff8ad0"); toast("MONIQUE CHAMOU REFORÇO");
    }
    if(d<12) playerDie();
  } else if(e.mode==="boss_johnny"){
    if(d>130) moveEnt(e,Math.cos(ea)*e.spd,Math.sin(ea)*e.spd);
    else if(d<80) moveEnt(e,-Math.cos(ea)*e.spd*0.8,-Math.sin(ea)*e.spd*0.8);
    e.step+=0.25;
    if(e.cool<=0 && los(e.x,e.y,p.x,p.y)){
      if(e.hp%2===0){ for(let i=-3;i<=3;i++){ const a=ea+i*0.14;
          G.bul.push({x:e.x+Math.cos(a)*11,y:e.y+Math.sin(a)*11,vx:Math.cos(a)*4.4,vy:Math.sin(a)*4.4,own:"e",life:80}); } e.cool=80; }
      else { const a=ea+(Math.random()-0.5)*0.3;
        G.bul.push({x:e.x+Math.cos(a)*11,y:e.y+Math.sin(a)*11,vx:Math.cos(a)*5.0,vy:Math.sin(a)*5.0,own:"e",life:80}); e.cool=11; }
      shake(2); sfx("shot");
      if(Math.random()<0.35) float(e.x,e.y-20,e.taunts[Math.floor(Math.random()*e.taunts.length)],"#ff5a5a");
    }
    if(e.tt%520===0){
      for(let i=0;i<3;i++){ const a=Math.random()*6.28, x=e.x+Math.cos(a)*70, y=e.y+Math.sin(a)*70;
        if(!solidTile(x,y)){ const m=mkEnemy(x,y,"melee",e.kind,Math.random); m.state="alert"; G.en.push(m); } }
      float(e.x,e.y-26,"TRAGAM O ELÁSTICO!","#ff5a5a");
    }
    if(d<12) playerDie();
  }
}

/* ---------- fluxo de campanha ---------- */
function startCampaign(k){
  G.camp=k; G.ch=0; G.score=0;
  playSeq(STORY[k].prologue, ()=>startChapter());
}
function startChapter(){
  const c=STORY[G.camp].chapters[G.ch];
  playSeq(c.pre, ()=>{ genLevel(c,G.camp); G.state="play"; toast(c.name); });
}
function finishChapter(){
  const c=STORY[G.camp].chapters[G.ch];
  G.score+=1000+G.ch*250;
  playSeq(c.post, ()=>{
    G.ch++;
    if(G.ch>=STORY[G.camp].chapters.length) playSeq(STORY[G.camp].ending, ()=>{ G.state="menu"; G.menuI=0; });
    else startChapter();
  });
}
function playSeq(seq,after){ G.seq=seq; G.seqI=0; G.seqChars=0; G.after=after; G.state="story"; }
function restartLevel(){
  const c=STORY[G.camp].chapters[G.ch];
  genLevel(c,G.camp); G.state="play"; G.dead=0; toast("DE NOVO. A CIDADE TE DEVOLVE.");
}

/* ===================== ÁUDIO ===================== */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } return AC; }
function tone(f,dur,type,vol,slide){
  if(!G.sound) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.08,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function nz(dur,vol){
  if(!G.sound) return; const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=b; g.gain.value=vol||0.08;
  s.connect(g); g.connect(a.destination); s.start();
}
function sfx(k){
  if(!G.sound) return;
  if(k==="shot") nz(0.08,0.11);
  else if(k==="kill"){ nz(0.16,0.13); tone(90,0.12,"sawtooth",0.07,40); }
  else if(k==="die"){ tone(220,0.6,"sawtooth",0.12,45); nz(0.3,0.12); }
  else if(k==="dry") tone(140,0.05,"square",0.05);
  else if(k==="swing") nz(0.05,0.06);
  else if(k==="click") tone(660,0.04,"square",0.05);
  else if(k==="type") tone(880,0.012,"square",0.02);
}
const BASS=[55,55,82,55,73,55,98,82];
function music(){
  if(!G.sound || G.state!=="play") return;
  if(G.t%22===0){ tone(52,0.1,"sine",0.14,30); }
  if(G.t%11===0) nz(0.02,0.03);
  if(G.t%44===0){ const n=BASS[(G.t/44|0)%BASS.length]; tone(n,0.34,"sawtooth",0.05); tone(n*2.01,0.26,"square",0.022); }
}

function shadeEnt(x,y,r){ CX.fillStyle="rgba(0,0,0,.45)"; CX.beginPath(); CX.ellipse(x,y+r*0.7,r*1.15,r*0.6,0,0,6.3); CX.fill(); }

function drawPawn(x,y,ang,kind,step,alert,scale){
  const s=scale||1, sw=Math.sin(step||0)*2.2;
  shadeEnt(x,y,7*s);
  CX.save(); CX.translate(x,y); CX.rotate(ang);
  let body="#6b2fb5", head="#f4efe2", acc="#3ddc84", gun="#20202c";
  if(kind==="podador"){ body="#6b2fb5"; head="#f4efe2"; acc="#3ddc84"; }
  else if(kind==="alan"){ body="#f5d90a"; head="#ffe95c"; acc="#8a5a2b"; }
  else if(kind==="vardo"){ body="#7b1f2b"; head="#d9a06b"; acc="#ff2e88"; }
  else if(kind==="cult"){ body="#efdac6"; head="#efdac6"; acc="#e01e37"; }
  else if(kind==="monique"){ body="#ff3d9a"; head="#f6ded0"; acc="#ffffff"; }
  else if(kind==="johnny"){ body="#efdac6"; head="#efdac6"; acc="#e01e37"; }
  // braços
  CX.fillStyle=body; CX.fillRect(2,-8*s+sw*0.3,7*s,3*s); CX.fillRect(2,5*s-sw*0.3,7*s,3*s);
  // tronco
  CX.fillStyle=body; CX.fillRect(-6*s,-6*s,12*s,12*s);
  if(kind==="cult"||kind==="johnny"){ CX.fillStyle=acc; CX.fillRect(-6*s,1*s,12*s,5*s); }
  if(kind==="alan"){ CX.fillStyle="#e9c400"; CX.fillRect(-6*s,-6*s,3*s,12*s); CX.fillStyle=acc; CX.fillRect(-8*s,-2*s,2*s,4*s); }
  if(kind==="podador"){ CX.fillStyle="#2a0f45"; CX.fillRect(-6*s,-2*s,12*s,2*s); }
  if(kind==="monique"){ CX.fillStyle="#c0136e"; CX.fillRect(-6*s,-6*s,12*s,3*s); }
  // cabeça
  CX.fillStyle=head; CX.beginPath(); CX.arc(0,0,4.6*s,0,6.3); CX.fill();
  if(kind==="podador"){ CX.fillStyle=acc; CX.beginPath(); CX.arc(-2,-4.4*s,2.1*s,0,6.3); CX.arc(-2,4.4*s,2.1*s,0,6.3); CX.fill();
    CX.fillStyle="#d51b4a"; CX.fillRect(2.4*s,-2.4*s,1.6*s,4.8*s); }
  if(kind==="alan"){ CX.fillStyle="#2b2b4a"; CX.fillRect(1.4*s,-2.6*s,2.4*s,5.2*s); CX.fillStyle="#4fd6ff"; CX.fillRect(2.2*s,-1.8*s,1*s,3.6*s); }
  if(kind==="vardo"){ CX.fillStyle=acc; CX.fillRect(-2.4*s,-4.6*s,3*s,9.2*s); }
  if(kind==="cult"||kind==="johnny"){ CX.fillStyle="#00000033"; CX.beginPath(); CX.arc(-1,0,3.4*s,0,6.3); CX.fill(); }
  if(kind==="monique"){ CX.fillStyle="#3b1020"; CX.beginPath(); CX.arc(-2.6*s,0,4.2*s,0,6.3); CX.fill(); }
  if(kind==="johnny"){ CX.fillStyle="#e01e37"; CX.fillRect(-5*s,-6.4*s,10*s,2*s); }
  // arma
  CX.fillStyle=gun; CX.fillRect(7*s,-1.4*s,8*s,2.8*s);
  CX.restore();
  if(alert){ CX.fillStyle="#ff2e88"; CX.font='bold 9px "Courier New",monospace'; CX.fillText("!",x-2,y-11*s); }
}

function drawWorld(){
  const ox=Math.round(G.cam.x - (Math.random()-0.5)*G.shake), oy=Math.round(G.cam.y - (Math.random()-0.5)*G.shake);
  const hueShift=(G.t*0.35)%360, pulse=Math.sin(G.t/38)*7*G.trip;
  CX.fillStyle="#07030c"; CX.fillRect(0,0,W,H);
  const x0=Math.max(0,Math.floor(ox/TILE)-1), x1=Math.min(MW-1,Math.floor((ox+W)/TILE)+1);
  const y0=Math.max(0,Math.floor(oy/TILE)-1), y1=Math.min(MH-1,Math.floor((oy+H)/TILE)+2);
  // chão
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const i=idx(x,y); if(G.lv.grid[i]===1) continue;
    const p=PAL[G.lv.col[i]%PAL.length][(x+y)%2];
    const h=(p[0]+hueShift*G.trip+Math.sin((x+y)/6+G.t/50)*10*G.trip)%360;
    CX.fillStyle=hsl(Math.round(h),p[1],Math.round(p[2]+pulse*0.4));
    CX.fillRect(x*TILE-ox,y*TILE-oy,TILE,TILE);
  }
  // sangue
  for(const d of G.dec){ CX.fillStyle=d.c; CX.beginPath(); CX.arc(d.x-ox,d.y-oy,d.r,0,6.3); CX.fill(); }
  // saída
  if(G.cleared){ const e=G.lv.exit, pr=6+Math.sin(G.t/8)*3;
    CX.fillStyle="rgba(255,46,136,.30)"; CX.beginPath(); CX.arc(e.x-ox,e.y-oy,16+pr,0,6.3); CX.fill();
    CX.strokeStyle="#ff2e88"; CX.lineWidth=2; CX.beginPath(); CX.arc(e.x-ox,e.y-oy,11,0,6.3); CX.stroke();
    CX.fillStyle="#ffd9ec"; CX.font='bold 9px "Courier New",monospace'; CX.fillText("SAIDA",e.x-ox-15,e.y-oy-16); }
  // armas no cenário
  for(const k of G.pk){
    CX.save(); CX.translate(k.x-ox,k.y-oy);
    CX.fillStyle="rgba(255,227,107,.20)"; CX.beginPath(); CX.arc(0,0,9,0,6.3); CX.fill();
    CX.fillStyle="#2a2a38"; CX.fillRect(-6,-2,12,4); CX.fillStyle="#c9c9dd"; CX.fillRect(-6,-2,4,4);
    CX.fillStyle="#ffe36b"; CX.font='bold 7px "Courier New",monospace';
    CX.fillText(WEP[k.id].name.slice(0,4),-9,-6); CX.restore();
  }
  // inimigos mortos
  for(const e of G.en) if(e.dead){ CX.save(); CX.translate(e.x-ox,e.y-oy); CX.rotate(e.ang);
    CX.fillStyle="#8f2030"; CX.fillRect(-8,-5,16,10); CX.fillStyle="#d9a06b"; CX.beginPath(); CX.arc(6,0,4,0,6.3); CX.fill(); CX.restore(); }
  // inimigos vivos
  for(const e of G.en) if(!e.dead){
    const kind = e.boss ? (e.name==="MONIQUE"?"monique":e.name==="JOHNNY CALCINHA"?"johnny":e.kind) : e.kind;
    drawPawn(e.x-ox,e.y-oy,e.ang,kind,e.step,e.state==="alert"&&!e.boss,e.boss?1.6:1);
    if(!e.boss && e.state!=="alert"){ // cone de visão
      CX.fillStyle="rgba(255,255,255,.045)"; CX.beginPath(); CX.moveTo(e.x-ox,e.y-oy);
      CX.arc(e.x-ox,e.y-oy,120,e.ang-0.95,e.ang+0.95); CX.closePath(); CX.fill(); }
  }
  // jogador
  if(!G.dead) drawPawn(G.p.x-ox,G.p.y-oy,G.p.ang,G.camp==="podador"?"podador":"alan",G.p.step,false,1);
  else { CX.save(); CX.translate(G.p.x-ox,G.p.y-oy); CX.rotate(G.p.ang);
    CX.fillStyle=G.camp==="podador"?"#6b2fb5":"#f5d90a"; CX.fillRect(-9,-5,18,10); CX.restore(); }
  // balas e faíscas
  for(const b of G.bul){ CX.strokeStyle=b.own==="p"?"#fff7c2":"#ff5f8f"; CX.lineWidth=2;
    CX.beginPath(); CX.moveTo(b.x-ox,b.y-oy); CX.lineTo(b.x-ox-b.vx*1.6,b.y-oy-b.vy*1.6); CX.stroke(); }
  for(const f of G.fx){ CX.fillStyle=f.c; CX.fillRect(f.x-ox-1,f.y-oy-1,2,2); }
  // paredes com falso relevo
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const i=idx(x,y); if(G.lv.grid[i]!==1) continue;
    const px=x*TILE-ox, py=y*TILE-oy;
    CX.fillStyle="#170a20"; CX.fillRect(px,py,TILE,TILE);
    const h=(320+hueShift*G.trip*0.6)%360;
    CX.fillStyle=hsl(Math.round(h),38,Math.round(15+pulse*0.3)); CX.fillRect(px,py-5,TILE,TILE);
    CX.fillStyle="rgba(255,46,136,.30)"; CX.fillRect(px,py-6,TILE,1.5);
  }
  // textos flutuantes
  CX.font='bold 11px "Courier New",monospace';
  for(const t of G.txt){ CX.fillStyle="rgba(0,0,0,.6)"; CX.fillText(t.s,t.x-ox-CX.measureText(t.s).width/2+1,t.y-oy+1);
    CX.fillStyle=t.c; CX.fillText(t.s,t.x-ox-CX.measureText(t.s).width/2,t.y-oy); }
}

function psy(){
  const a=0.05+0.09*G.trip;
  CX.globalCompositeOperation="overlay";
  const g=CX.createLinearGradient(0,0,W,H);
  g.addColorStop(0,hsl(Math.round((G.t*1.2)%360),90,55,a));
  g.addColorStop(0.5,hsl(Math.round((G.t*1.2+120)%360),90,55,a*0.6));
  g.addColorStop(1,hsl(Math.round((G.t*1.2+240)%360),90,55,a));
  CX.fillStyle=g; CX.fillRect(0,0,W,H);
  CX.globalCompositeOperation="source-over";
  if(G.flash>0.01){ CX.fillStyle="rgba(255,255,255,"+(G.flash*0.35)+")"; CX.fillRect(0,0,W,H); }
  CX.fillStyle="rgba(20,0,30,"+(0.10+0.06*Math.sin(G.t/30))+")"; CX.fillRect(0,0,W,H);
}

function box(x,y,w,h,fill,stroke){
  CX.fillStyle=fill||"rgba(4,2,8,.82)"; CX.fillRect(x,y,w,h);
  CX.strokeStyle=stroke||"#ff2e88"; CX.lineWidth=1; CX.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function txt(s,x,y,c,sz,bold){
  CX.font=(bold===false?"":"bold ")+(sz||11)+'px "Courier New",monospace';
  CX.fillStyle="rgba(0,0,0,.75)"; CX.fillText(s,x+1,y+1); CX.fillStyle=c||"#ffd9ec"; CX.fillText(s,x,y);
}
function wrap(s,max,sz){
  CX.font="bold "+(sz||11)+'px "Courier New",monospace';
  const words=s.split(" "), out=[]; let ln="";
  for(const w of words){ const t=ln?ln+" "+w:w;
    if(CX.measureText(t).width>max){ out.push(ln); ln=w; } else ln=t; }
  if(ln) out.push(ln); return out;
}

  lines.slice(-4).forEach((l,i)=>txt(l,bx+76,by+48+i*14,"#1a1020",11));
  txt("ESC pula",bx+8,by+bh-8,"#00000055",9);
  txt("> ENTER",bx+bw-64,by+bh-8,"#c0136e",10);
  const cap=(G.camp?STORY[G.camp].title:"")+" · "+(G.seqI+1)+"/"+G.seq.length;
  txt(cap,24,26,"#ff8ad0",10);
}

const MENU=["CAMPANHA: O PODADOR  (vs MONIQUE)","CAMPANHA: ALAN BANANA  (vs JOHNNY CALCINHA)","ARQUIVOS DE VILA NEON","COMO JOGAR"];
function drawMenu(){
  bgPsy();
  const t1="HOTLINE", t2="MONIQUE";
  CX.font='bold 52px "Courier New",monospace';
  CX.fillStyle="rgba(0,229,255,.75)"; CX.fillText(t1,W/2-CX.measureText(t1).width/2-3,96);
  CX.fillStyle="rgba(255,46,136,.85)"; CX.fillText(t1,W/2-CX.measureText(t1).width/2+3,96);
  CX.fillStyle="#fff4fb"; CX.fillText(t1,W/2-CX.measureText(t1).width/2,96);
  CX.fillStyle="rgba(255,227,107,.8)"; CX.fillText(t2,W/2-CX.measureText(t2).width/2+3,140);
  CX.fillStyle="#ff2e88"; CX.fillText(t2,W/2-CX.measureText(t2).width/2,140);
  txt("PODA NEON · VILA NEON, 1989 · TIRO ISOMÉTRICO PSICODÉLICO",W/2-190,162,"#ff8ad0",11);
  MENU.forEach((m,i)=>{
    const y=204+i*26, sel=i===G.menuI;
    if(sel){ box(W/2-206,y-15,412,22,"rgba(255,46,136,.18)","#ff2e88"); }
    txt((sel?"> ":"  ")+m,W/2-196,y,sel?"#fff":"#ff8ad0",12);
  });
  txt("SETAS/MOUSE escolher · ENTER confirmar · M som",W/2-150,H-24,"#ff8ad066",10);
}
function drawHowto(){
  bgPsy();
  txt("COMO JOGAR",34,44,"#ff2e88",20);
  const L=["WASD / SETAS — andar","MOUSE — mirar    CLIQUE — atirar ou golpear","C — trocar de arma    E — pegar arma do chão",
    "R — reiniciar a fase    ESC — voltar    M — som","","UM TIRO MATA VOCÊ. UM TIRO MATA ELES.",
    "A FACA só mata quem NÃO te viu (pelas costas ou desprevenido).","TACO e SERRA matam qualquer um, mas exigem chegar perto.",
    "MUNIÇÃO NÃO É INFINITA: pegue armas no cenário e conte cada bala.","CADA TIRO FAZ BARULHO e chama inimigos de outras salas.",
    "MATE TODOS e vá até a SAÍDA rosa para avançar o capítulo.","CHEFES têm barra de vida: precisam de vários tiros.",""," ESC para voltar"];
  L.forEach((l,i)=>txt(l,34,74+i*17,i===5?"#ffe36b":"#ffd9ec",11));
}
function drawCodex(){
  bgPsy();
  txt("ARQUIVOS DE VILA NEON",24,36,"#ff2e88",16);
  CODEX.forEach((c,i)=>{ const y=62+i*17, sel=i===G.codexI;
    txt((sel?"> ":"  ")+c.t,24,y,sel?"#fff":"#ff8ad0",10); });
  const c=CODEX[G.codexI];
  box(228,52,W-252,H-84);
  txt(c.t,240,72,"#ffe36b",12);
  let y=92;
  c.b.split("\n").forEach(par=>{ if(!par.trim()){ y+=8; return; }
    wrap(par,W-286,10).forEach(l=>{ txt(l,240,y,"#ffd9ec",10); y+=13; }); y+=4; });
  txt("SETAS trocar · ESC voltar",24,H-24,"#ff8ad066",10);
}
function drawDead(){
  drawWorld(); psy();
  CX.fillStyle="rgba(120,0,30,.35)"; CX.fillRect(0,0,W,H);
  const s="VOCÊ MORREU";
  CX.font='bold 34px "Courier New",monospace';
  CX.fillStyle="#000"; CX.fillText(s,W/2-CX.measureText(s).width/2+2,H/2+2);
  CX.fillStyle="#ff2e88"; CX.fillText(s,W/2-CX.measureText(s).width/2,H/2);
  const l2 = G.camp==="podador" ? "MONIQUE VAI CONTAR ESSA HISTÓRIA DO JEITO DELA." : "O CULTO VAI DOBRAR A SUA CASCA COMO ESTANDARTE.";
  txt(l2,W/2-CX.measureText(l2).width/2,H/2+26,"#ffd9ec",11);
  txt("R — TENTAR DE NOVO      ESC — MENU",W/2-120,H/2+52,"#ffe36b",12);
}

/* ===================== ENTRADA ===================== */
const keys={}, mouse={x:W/2,y:H/2,down:false};
addEventListener("keydown",function(e){
  keys[e.code]=true;
  if(["Space","KeyC","KeyE","KeyR","Enter","Escape","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyM"].indexOf(e.code)>=0) e.preventDefault();
  onKey(e.code);
});
addEventListener("keyup",function(e){ keys[e.code]=false; });
CV.addEventListener("mousemove",function(e){ const r=CV.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)/r.width*W; mouse.y=(e.clientY-r.top)/r.height*H; });
CV.addEventListener("mousedown",function(e){ mouse.down=true; ac(); onClick(); });
addEventListener("mouseup",function(){ mouse.down=false; });
CV.addEventListener("contextmenu",function(e){ e.preventDefault(); });

function onKey(k){
  if(k==="KeyM"){ G.sound=!G.sound; toast(G.sound?"SOM LIGADO":"SOM MUDO"); }
  if(G.state==="menu"){
    if(k==="ArrowUp") G.menuI=(G.menuI+MENU.length-1)%MENU.length;
    if(k==="ArrowDown") G.menuI=(G.menuI+1)%MENU.length;
    if(k==="Enter"||k==="Space") menuPick();
  } else if(G.state==="story"){
    if(k==="Enter"||k==="Space") advance();
    if(k==="Escape"){ const a=G.after; G.seq=null; if(a) a(); }
  } else if(G.state==="play"){
    if(k==="KeyC") swap();
    if(k==="KeyE") grab();
    if(k==="KeyR") restartLevel();
    if(k==="Space") fire();
    if(k==="Escape"){ G.state="menu"; G.menuI=0; }
  } else if(G.state==="dead"){
    if(k==="KeyR"||k==="Enter") restartLevel();
    if(k==="Escape"){ G.state="menu"; G.menuI=0; }
  } else if(G.state==="codex"){
    if(k==="ArrowUp") G.codexI=(G.codexI+CODEX.length-1)%CODEX.length;
    if(k==="ArrowDown") G.codexI=(G.codexI+1)%CODEX.length;
    if(k==="Escape"||k==="Enter"){ G.state="menu"; }
  } else if(G.state==="howto"){
    if(k==="Escape"||k==="Enter") G.state="menu";
  }
}
function onClick(){
  if(G.state==="play") fire();
  else if(G.state==="story") advance();
  else if(G.state==="menu"){
    const i=Math.round((mouse.y-204)/26);
    if(i>=0&&i<MENU.length){ G.menuI=i; menuPick(); }
  } else if(G.state==="howto"||G.state==="codex") G.state="menu";
  else if(G.state==="dead") restartLevel();
}
function menuPick(){
  sfx("click");
  if(G.menuI===0) startCampaign("podador");
  else if(G.menuI===1) startCampaign("alan");
  else if(G.menuI===2){ G.state="codex"; G.codexI=0; }
  else G.state="howto";
}
function advance(){
  if(!G.seq) return;
  const full=G.seq[G.seqI].t;
  if(G.seqChars<full.length){ G.seqChars=full.length; return; }
  G.seqI++; G.seqChars=0;
  if(G.seqI>=G.seq.length){ const a=G.after; G.seq=null; if(a) a(); }
}

/* ===================== LOOP ===================== */
function frame(){
  G.t++;
  if(G.state==="play"){ updatePlay(); drawWorld(); psy(); drawHUD(); music(); }
  else if(G.state==="dead"){ if(G.shake>0)G.shake*=0.9; drawDead(); }
  else if(G.state==="story"){
    if(G.seq){ const full=G.seq[G.seqI].t;
      if(G.seqChars<full.length){ G.seqChars+=1.9; if(G.t%3===0) sfx("type"); }
      drawStory(); }
  }
  else if(G.state==="menu") drawMenu();
  else if(G.state==="codex") drawCodex();
  else if(G.state==="howto") drawHowto();
  requestAnimationFrame(frame);
}
frame();
</script>
